spring.application.name=sherlock
server.port=8080

### dbservice 
## dataset
# mongodb
mongodb.dataset.uri=mongodb://admin:password@sherlock-db-mongo:27017/dataset?authSource=admin
# postgres
spring.datasource.url=jdbc:postgresql://sherlock-db-postgres:5432/fragment
spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.show-sql=false
# hibernate
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
logging.level.sql=warn

## result
# mongodb
mongodb.result.uri=mongodb://admin:password@sherlock-db-mongo:27017/result?authSource=admin

## statistics 
# mongodb
mongodb.statistics.uri=mongodb://admin:password@sherlock-db-mongo:27017/statistics?authSource=admin

### job scheduler
sherlock.job.pool-size=4
sherlock.job.queue-size=1000